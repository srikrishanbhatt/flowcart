version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowcart
      POSTGRES_USER: flowcart_user
      POSTGRES_PASSWORD: flowcart_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowcart_user -d flowcart']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
